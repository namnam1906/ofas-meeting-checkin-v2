name = "ofas-checkin-v2"
main = "src/worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
REQUIRE_ACCESS = "true"

# Replace database_id after creating the separate v2 D1 database.
[[d1_databases]]
binding = "DB"
database_name = "ofas-meeting-checkin-v2-db"
database_id = "aba0515a-2d16-4966-8e14-01fb5cc19acb"
migrations_dir = "migrations"
